services:
  pigeonpost:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      additional_contexts:
        - nugets=../../../nugets
    image: pigeonpost:latest
    container_name: pigeonpost-client
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      TUN_NAME: tun0
      TUN_CIDR: 10.0.10.11/24
      PEER_IP: 10.0.10.1
    command: --role client --tun tun0 --url '${PIGEON_URL:?Set PIGEON_URL}'
    restart: unless-stopped
