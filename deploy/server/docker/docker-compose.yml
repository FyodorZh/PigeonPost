services:
  pigeonpost:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      additional_contexts:
        - nugets=../../../nugets
    image: pigeonpost:latest
    container_name: pigeonpost-server
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      TUN_NAME: tun0
      TUN_CIDR: 10.0.10.1/24
    command: --role server --tun tun0 --url '${PIGEON_URL:?Set PIGEON_URL}'
    restart: unless-stopped
